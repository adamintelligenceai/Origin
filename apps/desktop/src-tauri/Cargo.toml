[package]
name = "project-chief"
version = "0.0.1"
description = "Project Chief desktop personal node"
edition = "2021"

[lib]
name = "project_chief_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
